# Runs on every push and pull request: type checks, unit tests (with coverage), build, browser tests.
# Netlify also runs the unit tests before every deploy (netlify.toml), so a failing test never goes live.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and server tests (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (local server, throwaway data, no outside calls)
        run: npm run e2e
        env:
          CI: 'true'

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage/
            playwright-report/
          retention-days: 14
