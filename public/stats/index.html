<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>PULSE stats</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: 'Unbounded'; font-weight: 200 900; font-display: swap; src: url(/fonts/unbounded.woff2) format('woff2'); }
    @font-face { font-family: 'Onest'; font-weight: 100 900; font-display: swap; src: url(/fonts/onest.woff2) format('woff2'); }
    :root {
      --bg: #F6F5F2; --surface: #FFFFFF; --sunk: #EDEBE6; --ink: #17140F; --ink2: #57524A; --ink3: #746F67; --line: #E4E1DA;
      --accent: #EC5B2B; --accent-soft: #F5E1D8; --pos: #1F7A4D; --bar2: #C9C4BA;
      --display: 'Unbounded', system-ui, sans-serif; --body: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg: #12110F; --surface: #1C1A17; --sunk: #25221E; --ink: #F3F1EC; --ink2: #BDB8AE; --ink3: #948F86; --line: #2F2C27; --accent-soft: #3E2015; --pos: #4CC38A; --bar2: #4A453E; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 60px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .wm { font-family: var(--display); font-weight: 800; letter-spacing: -0.03em; font-size: 22px; }
    .wm span { color: var(--accent); }
    .muted { color: var(--ink3); font-size: 13px; }
    h2 { font-family: var(--display); font-size: 15px; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.01em; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; min-width: 0; }
    .grid { display: grid; gap: 12px; }
    .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 12px; }
    .two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-top: 12px; }
    .kpi .n { font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 6px; }
    .kpi .l { font-size: 13px; color: var(--ink2); font-weight: 600; }
    .chart { display: flex; align-items: flex-end; gap: 2px; height: 160px; margin-top: 14px; border-bottom: 1px solid var(--line); }
    .chart .c { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; position: relative; min-width: 0; }
    .chart .b { background: var(--accent); border-radius: 3px 3px 0 0; min-height: 1px; }
    .chart .b.new { background: var(--bar2); border-radius: 0; }
    .chart .c:hover .b { opacity: .8; }
    .axis { display: flex; justify-content: space-between; color: var(--ink3); font-size: 11.5px; margin-top: 6px; }
    .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink2); margin-top: 8px; flex-wrap: wrap; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .rows { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .row .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
    .row .top b { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .track { height: 8px; background: var(--sunk); border-radius: 99px; margin-top: 5px; overflow: hidden; }
    .fill { height: 100%; background: var(--accent); border-radius: 99px; }
    .fill.pos { background: var(--pos); }
    .ret { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .ret > div { background: var(--sunk); border-radius: 14px; padding: 10px 11px; min-width: 0; }
    .ret .muted { font-size: 12px; line-height: 1.3; }
    .ret .n { font-family: var(--display); font-size: clamp(17px, 4.6vw, 22px); font-weight: 700; margin: 4px 0 2px; white-space: nowrap; }
    .row .top span:first-child::first-letter { text-transform: uppercase; }
    .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); display: none; z-index: 5; }
    form { max-width: 380px; margin: 14vh auto 0; display: flex; flex-direction: column; gap: 12px; }
    input { font: inherit; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 13px 20px; background: var(--accent); color: #fff; cursor: pointer; }
    .ghost { background: transparent; color: var(--ink2); padding: 8px 12px; font-weight: 600; font-size: 13px; border: 1px solid var(--line); }
    select { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
    .err { color: #C2412D; font-size: 14px; }
    .note { font-size: 12.5px; color: var(--ink3); margin-top: 10px; }
    .fb { border-top: 1px solid var(--line); padding: 14px 0 12px; }
    .fb:first-of-type { margin-top: 12px; }
    .fbh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .tag { background: var(--sunk); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; }
    .fbm { margin: 8px 0 6px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .dm { display: flex; gap: 12px; align-items: flex-start; border-top: 1px solid var(--line); padding: 11px 0; }
    .dm:first-child { border-top: 0; }
    .dm .when { flex: 0 0 74px; font-size: 13px; font-weight: 700; line-height: 1.35; }
    .dm .when span { display: block; font-weight: 500; color: var(--ink3); }
    .dm .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .dm .what b { display: block; font-size: 14.5px; }
    .dm .what p { margin: 2px 0 6px; font-size: 13.5px; color: var(--ink2); }
    .tag.mine { background: var(--accent-soft); color: var(--accent); }
    .now { background: var(--sunk); border-radius: 14px; padding: 12px 14px; margin-top: 12px; overflow-wrap: anywhere; }
    .write { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; max-width: 520px; }
    .write label { font-size: 13px; font-weight: 600; color: var(--ink2); display: flex; flex-direction: column; gap: 5px; }
    .write label span { font-weight: 500; color: var(--ink3); }
    .write .lr { display: flex; justify-content: space-between; gap: 10px; }
    .write input, .write textarea { font: inherit; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
    .write textarea { resize: vertical; min-height: 76px; }
    .write .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .write .ghost { padding: 13px 18px; font-size: 14px; }
  </style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tip" id="tip"></div>
<script>
(function () {
  var app = document.getElementById('app');
  var tip = document.getElementById('tip');
  var KEY = 'pulse-stats-key';
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var fmt = function (n) { return n == null ? '–' : Number(n).toLocaleString('en-IN'); };
  var pct = function (n) { return n == null ? '–' : n + '%'; };
  var short = function (d) { var x = new Date(d + 'T00:00:00'); return x.getDate() + ' ' + x.toLocaleString('en-IN', { month: 'short' }); };
  function getKey() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setKey(k) { try { k ? localStorage.setItem(KEY, k) : localStorage.removeItem(KEY); } catch (e) {} }

  function login(msg) {
    app.innerHTML = '<form id="f"><div class="wm">PULSE<span>.</span> stats</div>' +
      '<p class="muted" style="margin:0">Private. Enter your password.</p>' +
      '<input id="k" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>' +
      (msg ? '<p class="err" role="alert" style="margin:0">' + esc(msg) + '</p>' : '') +
      '<button type="submit">Open stats</button></form>';
    document.getElementById('f').onsubmit = function (e) { e.preventDefault(); setKey(document.getElementById('k').value.trim()); load(); };
  }

  var days = 60;
  function load() {
    var key = getKey();
    if (!key) return login();
    app.innerHTML = '<p class="muted">Loading…</p>';
    fetch('/api/stats?days=' + days, { headers: { 'x-stats-key': key }, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) { setKey(''); login('That password is not right.'); return null; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (!d) return;
        // Feedback is a separate, smaller request. Stats still show if it fails.
        return fetch('/api/feedback', { headers: { 'x-stats-key': key }, cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (fb) {
            return fetch('/api/push?status=1', { headers: { 'x-stats-key': key }, cache: 'no-store' })
              .then(function (r) { return r.ok ? r.json() : null; })
              .catch(function () { return null; })
              .then(function (push) {
                render(d, fb, push);
                loadMembers();
                loadDaily();
              });
          });
      })
      .catch(function (e) { app.innerHTML = '<p class="err">Could not load stats (' + esc(e.message) + '). Try again in a minute.</p>'; });
  }

  function bars(list, max, cls) {
    return list.map(function (r) {
      var w = max ? Math.round((r.n / max) * 100) : 0;
      return '<div class="row"><div class="top"><span>' + esc(r.label) + '</span><b>' + fmt(r.n) + (r.of ? ' <span class="muted">· ' + pct(r.of) + '</span>' : '') + '</b></div><div class="track"><div class="fill ' + (cls || '') + '" style="width:' + w + '%"></div></div></div>';
    }).join('');
  }

  function feedback(fb) {
    if (!fb) return '<div class="card" style="margin-top:12px"><h2>Feedback</h2><p class="muted">Could not load feedback right now.</p></div>';
    var items = fb.items || [];
    var rated = items.filter(function (x) { return x.rating; });
    var avg = rated.length ? Math.round((rated.reduce(function (a, x) { return a + x.rating; }, 0) / rated.length) * 10) / 10 : null;
    var failed = items.filter(function (x) { return x.mailed === false; }).length;
    var wants = fb.wants || [];
    var wMax = Math.max.apply(null, wants.map(function (x) { return x.n; }).concat(1));
    return '<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">' +
      '<div><h2>Feedback</h2><div class="muted">' + fmt(fb.total || 0) + ' message' + (fb.total === 1 ? '' : 's') +
      (avg ? ' · average vibe ' + avg + '/5' : '') + (fb.emailOn === false ? ' · <span class="err">email is off: RESEND_API_KEY is missing in Netlify</span>' : failed ? ' · <span class="err">' + failed + ' not emailed</span>' : '') + '</div></div>' +
      '<a href="/stats/feedback/" id="fbopen" style="display:inline-block;text-decoration:none;font-weight:700;border-radius:999px;padding:10px 18px;font-size:14px;background:var(--accent);color:#fff">' +
      (fb.total ? 'Open all ' + fmt(fb.total) + ' message' + (fb.total === 1 ? '' : 's') + ' →' : 'Open feedback page →') + '</a></div>' +
      (wants.length ? '<h2 style="margin-top:16px">Most wanted</h2><div class="rows">' + bars(wants, wMax) + '</div>' : '') +
      (fb.total ? '' : '<p class="muted" style="margin-top:10px">No feedback yet. It shows up the moment someone sends it from You → Send feedback.</p>') + '</div>';
  }

  function reminders(p) {
    if (!p) return '';
    var last = p.lastRun ? new Date(p.lastRun) : null;
    var mins = last ? Math.round((Date.now() - last.getTime()) / 60000) : null;
    var late = mins != null && mins > 40;
    return '<div class="card" style="margin-top:12px"><h2>Reminders</h2><div class="muted">Notifications sent to phones that turned them on</div><div class="ret">' +
      '<div><div class="muted">Devices with reminders on</div><div class="n">' + fmt(p.devices || 0) + '</div></div>' +
      '<div><div class="muted">Sent today</div><div class="n">' + fmt(p.sentToday || 0) + '</div></div>' +
      '<div><div class="muted">Sender last ran</div><div class="n" style="font-size:16px' + (late ? ';color:#C2412D' : '') + '">' + (mins == null ? 'Never' : mins < 2 ? 'Just now' : mins < 120 ? mins + ' min ago' : Math.round(mins / 60) + ' h ago') + '</div></div></div>' +
      (mins == null ? '<p class="note">The sender runs every 15 minutes. If this still says “Never” an hour after the deploy, the schedule did not start: tell Claude.</p>'
        : late ? '<p class="note err">The sender should run every 15 minutes. It looks stuck.</p>' : '') + '</div>';
  }

  // ---- Accounts: how many people have signed in, and the latest to join ----
  function loadMembers() {
    fetch('/api/auth?members=1', { headers: { 'x-stats-key': getKey() }, cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (m) { var el = document.getElementById('members'); if (el) el.innerHTML = members(m); });
  }
  function members(m) {
    if (!m) return '';
    var cell = function (label, n, sub) { return '<div><div class="muted">' + label + '</div><div class="n">' + fmt(n) + '</div>' + (sub ? '<div class="muted">' + sub + '</div>' : '') + '</div>'; };
    var max = Math.max.apply(null, m.days.map(function (d) { return d.n; }).concat(1));
    var chart = '<div style="display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:14px" role="img" aria-label="New accounts per day, last 14 days">' +
      m.days.map(function (d) {
        return '<div title="' + esc(short(d.day)) + ': ' + d.n + '" style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%">' +
          '<div style="height:' + Math.max(d.n ? 8 : 3, Math.round((d.n / max) * 100)) + '%;border-radius:5px 5px 2px 2px;background:' + (d.n ? 'var(--accent)' : 'var(--line)') + '"></div></div>';
      }).join('') + '</div>' +
      '<div class="muted" style="display:flex;justify-content:space-between;margin-top:4px"><span>' + esc(short(m.days[0].day)) + '</span><span>New accounts per day</span><span>Today</span></div>';
    var when = function (iso) { return new Date(iso).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); };
    var list = m.latest.map(function (a) {
      return '<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px">' +
        '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>#' + a.n + '</b> ' + esc(a.name || '') + ' <span class="muted">' + esc(a.email) + '</span></span>' +
        '<span class="muted" style="white-space:nowrap">' + (a.google ? 'Google' : 'Email') + ' · ' + esc(when(a.at)) + '</span></div>';
    }).join('');
    var gone = m.highest - m.total;
    return '<div class="card" style="margin-bottom:12px"><h2>Accounts</h2><div class="muted">People who have signed in with Google or an email code</div><div class="ret">' +
      cell('Registered', m.total, gone > 0 ? gone + ' deleted theirs' : '') + cell('New today', m.today) + cell('Last 7 days', m.week) + '</div>' +
      (m.total ? chart + '<h2 style="margin-top:18px">Latest to join</h2>' + list +
        '<p class="note">Email addresses are partly hidden on purpose: this page opens with one shared password, so it does not show anyone\'s full address.</p>'
        : '<p class="muted" style="margin-top:10px">Nobody has signed in yet. Accounts show up here the moment someone does.</p>') + '</div>';
  }

  // ---- Daily message: what goes out each morning, and a box to write your own ----
  var SRC = { custom: 'Your message', occasion: 'Festival / occasion', month: 'Time of the month', line: 'Money line' };
  var wday = function (d) { return new Date(d + 'T00:00:00').toLocaleString('en-IN', { weekday: 'short' }); };
  var draft = { date: '', title: '', body: '' };
  // If reminders are on in PULSE on this same phone, a message can be tried here first.
  function myDevice() { try { var l = JSON.parse(localStorage.getItem('pulse-push-v1') || 'null'); return l && l.on && /^[0-9a-f]{32}$/.test(l.id) ? l.id : ''; } catch (e) { return ''; } }
  function pushApi(body) {
    return fetch('/api/push', { method: 'POST', headers: { 'content-type': 'application/json', 'x-stats-key': getKey() }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.ok = r.ok && j.ok !== false; return j; }); })
      .catch(function () { return { ok: false, error: 'No connection. Try again.' }; });
  }
  function loadDaily(msg, good) {
    var box = document.getElementById('daily');
    if (!box) return;
    fetch('/api/push?daily=1', { headers: { 'x-stats-key': getKey() }, cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (dl) { box.innerHTML = dailyCard(dl, msg, good); if (dl) wireDaily(dl); });
  }
  function dailyCard(dl, msg, good) {
    if (!dl) return '';
    var s = dl.sentToday;
    var first = dl.days[0];
    var nw = dl.now || { max: 10, used: 0, list: [] };
    var left = Math.max(0, nw.max - nw.used);
    var now = s
      ? '<div class="now"><div class="muted">Today · ' + (s.done ? 'sent to ' : 'sending, so far ') + fmt(s.sent) + ' phone' + (s.sent === 1 ? '' : 's') + (s.failed ? ' · ' + fmt(s.failed) + ' will be tried again' : '') + '</div><b>' + esc(s.title) + '</b><div>' + esc(s.body) + '</div></div>'
      : '<div class="now"><div class="muted">Today · ' + (dl.phase === 'before' ? 'goes out at 10:00 am India time' : dl.phase === 'due' ? 'going out within 15 minutes' : '<span class="err">not sent: the sender did not run between 10 am and 4 pm</span>') + '</div><b>' + esc(first.title) + '</b><div>' + esc(first.body) + '</div></div>';
    var rows = dl.days.slice(1).map(function (x) {
      return '<div class="dm"><div class="when">' + esc(short(x.date)) + '<span>' + esc(wday(x.date)) + '</span></div><div class="what"><b>' + esc(x.title) + '</b><p>' + esc(x.body) + '</p>' +
        '<span class="tag' + (x.source === 'custom' ? ' mine' : '') + '">' + SRC[x.source] + '</span>' +
        (x.source === 'custom' ? ' <button class="ghost" data-del="' + esc(x.date) + '">Remove</button>' : '') + '</div></div>';
    }).join('');
    var later = (dl.customs || []).filter(function (c) { return c.date > dl.days[dl.days.length - 1].date; }).map(function (c) {
      return '<div class="dm"><div class="when">' + esc(short(c.date)) + '<span>' + esc(wday(c.date)) + '</span></div><div class="what"><b>' + esc(c.title) + '</b><p>' + esc(c.body) + '</p><span class="tag mine">Your message</span> <button class="ghost" data-del="' + esc(c.date) + '">Remove</button></div></div>';
    }).join('');
    return '<div class="card" style="margin-top:12px"><h2>Daily message</h2>' +
      '<div class="muted">One notification every morning to every phone with reminders on. People can switch it off in You → Reminders.</div>' + now +
      '<h2 style="margin-top:18px">Write your own</h2><div class="muted">For a new feature, an offer, or a wish. It replaces that day’s usual message.</div>' +
      '<div class="write">' +
      '<label>Date<input type="date" id="dmd" min="' + esc(s || dl.phase === 'missed' ? dl.days[1].date : dl.today) + '" value="' + esc(draft.date || dl.days[1].date) + '"></label>' +
      '<label><div class="lr">Title <span id="dmtc"></span></div><input id="dmt" maxlength="60" placeholder="New in PULSE ✨" value="' + esc(draft.title) + '"></label>' +
      '<label><div class="lr">Message <span id="dmbc"></span></div><textarea id="dmb" maxlength="140" placeholder="Pick Bank or Cash when you log a spend.">' + esc(draft.body) + '</textarea></label>' +
      '<div class="btns"><button id="dmn"' + (left ? '' : ' disabled style="opacity:.45"') + '>Send now to everyone</button><button class="ghost" id="dms">Save for the date above</button>' + (myDevice() ? '<button class="ghost" id="dmp">Send to this phone first</button>' : '') + '</div>' +
      '<div class="muted">Send now: ' + (left ? left + ' of ' + nw.max + ' left today. ' : 'all ' + nw.max + ' used today, the next one can go tomorrow. ') + 'It goes to every phone straight away, on top of the 10 am message. Use it rarely: too many notifications and people switch them off.</div>' +
      '<div id="dmm" role="status" class="' + (good ? 'muted' : 'err') + '" style="min-height:20px">' + esc(msg || '') + '</div></div>' +
      (nw.list.length ? '<h2 style="margin-top:10px">Sent by you today</h2><div style="margin-top:6px">' + nw.list.map(function (x) {
        var t = new Date(x.at).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
        return '<div class="dm"><div class="when">' + esc(t) + '<span>#' + x.n + '</span></div><div class="what"><b>' + esc(x.title) + '</b><p>' + esc(x.body) + '</p><span class="tag mine">' + (x.done ? 'Sent to ' : 'Sending, so far ') + fmt(x.sent) + ' phone' + (x.sent === 1 ? '' : 's') + (x.failed ? ' · ' + fmt(x.failed) + ' being retried' : '') + '</span></div></div>';
      }).join('') + '</div>' : '') +
      '<h2 style="margin-top:10px">Coming up</h2><div style="margin-top:6px">' + rows + later + '</div>' +
      '<p class="note">Festival dates are loaded until ' + esc(short(dl.lastOccasion)) + ' ' + esc(dl.lastOccasion.slice(0, 4)) + '. After that only fixed days (New Year, 15 August, Christmas…) and money lines go out, until the list is refreshed.' +
      (myDevice() ? '' : ' To try a message on your own phone first, open this page on a phone where PULSE reminders are on.') + '</p></div>';
  }
  function wireDaily(dl) {
    var d = document.getElementById('dmd'), t = document.getElementById('dmt'), b = document.getElementById('dmb'), m = document.getElementById('dmm');
    var count = function () { document.getElementById('dmtc').textContent = t.value.length + '/60'; document.getElementById('dmbc').textContent = b.value.length + '/140'; draft = { date: d.value, title: t.value, body: b.value }; };
    t.oninput = b.oninput = d.onchange = count; count();
    var say = function (text, good) { m.textContent = text; m.className = good ? 'muted' : 'err'; };
    document.getElementById('dms').onclick = function () {
      if (!t.value.trim()) return say('Write a title first.');
      var taken = dl.days.concat(dl.customs || []).filter(function (x) { return x.date === d.value && x.source !== 'line' && x.source !== 'month'; })[0];
      var date = d.value;
      say('Saving…', true);
      pushApi({ action: 'daily-set', date: date, title: t.value, body: b.value }).then(function (r) {
        if (!r.ok) return say(r.error || 'Could not save. Try again.');
        draft = { date: '', title: '', body: '' };
        loadDaily('Saved. It goes out on ' + short(date) + ' at 10:00 am.' + (taken && taken.source === 'occasion' ? ' It replaces “' + taken.title + '”.' : ''), true);
      });
    };
    // Send now: the first tap asks, the second tap sends.
    var nowBtn = document.getElementById('dmn'), armed = 0;
    nowBtn.onclick = function () {
      if (!t.value.trim()) return say('Write a title first.');
      if (Date.now() - armed > 6000) {
        armed = Date.now();
        var night = dl.hour >= 22 || dl.hour < 8;
        nowBtn.textContent = night ? 'It is night in India. Tap again to send anyway' : 'Tap again to send to everyone';
        setTimeout(function () { if (Date.now() - armed >= 6000) nowBtn.textContent = 'Send now to everyone'; }, 6100);
        return;
      }
      armed = 0; nowBtn.disabled = true; nowBtn.textContent = 'Sending…';
      pushApi({ action: 'daily-now', title: t.value, body: b.value }).then(function (r) {
        if (!r.ok) { nowBtn.disabled = false; nowBtn.textContent = 'Send now to everyone'; return say(r.error || 'Could not send. Try again.'); }
        draft = { date: d.value, title: '', body: '' };
        loadDaily('Sent to ' + fmt(r.sent) + ' phone' + (r.sent === 1 ? '' : 's') + (r.done ? '.' : '. The rest will get it within 15 minutes.'), true);
      });
    };
    var p = document.getElementById('dmp');
    if (p) p.onclick = function () {
      if (!t.value.trim()) return say('Write a title first.');
      say('Sending to this phone…', true);
      pushApi({ action: 'daily-try', id: myDevice(), title: t.value, body: b.value }).then(function (r) { say(r.ok ? 'Sent to this phone only. It should pop up in a few seconds.' : (r.error || 'Could not send.'), r.ok); });
    };
    [].forEach.call(document.querySelectorAll('[data-del]'), function (btn) {
      btn.onclick = function () { pushApi({ action: 'daily-del', date: btn.getAttribute('data-del') }).then(function () { loadDaily('Removed. The usual message goes out that day.', true); }); };
    });
  }

  function render(d, fb, push) {
    var t = d.totals;
    var max = Math.max(1, Math.max.apply(null, d.daily.map(function (x) { return x.active + 0; })), Math.max.apply(null, d.daily.map(function (x) { return x.newcomers; })));
    var cols = d.daily.map(function (x) {
      var nNew = Math.min(x.newcomers, x.active);
      var hOld = ((x.active - nNew) / max) * 100, hNew = (nNew / max) * 100;
      return '<div class="c" data-tip="' + esc(short(x.day) + ': ' + x.active + ' active · ' + x.newcomers + ' new · ' + x.logs + ' logs' + (x.demo ? ' · ' + x.demo + ' demo only' : '')) + '">' +
        '<div class="b" style="height:' + hOld + '%"></div><div class="b new" style="height:' + hNew + '%"></div></div>';
    }).join('');
    var top = d.funnel[0].n || 1;
    var funnel = d.funnel.map(function (r) { return { label: r.label, n: r.n, of: Math.round((r.n / top) * 100) }; });
    var f = d.features.slice().sort(function (a, b) { return b.n - a.n; });
    var fMax = Math.max(1, f[0] ? f[0].n : 1);
    var r = d.retention;
    var retCell = function (label, x) { return '<div><div class="muted">' + label + '</div><div class="n">' + pct(x.pct) + '</div><div class="muted">' + fmt(x.came) + ' of ' + fmt(x.eligible) + '</div></div>'; };
    var dev = function (list) { var m = Math.max.apply(null, list.map(function (x) { return x.n; }).concat(1)); return bars(list, m, 'pos'); };

    app.innerHTML =
      '<header><div><div class="wm">PULSE<span>.</span> stats</div><div class="muted">' + short(d.from) + ' – ' + short(d.today) + ' · anonymous counts, by device</div></div>' +
      '<div style="display:flex;gap:8px;align-items:center"><select id="days" aria-label="Period">' +
      [30, 60, 90, 120].map(function (n) { return '<option value="' + n + '"' + (n === days ? ' selected' : '') + '>Last ' + n + ' days</option>'; }).join('') +
      '</select><button class="ghost" id="ref">Refresh</button><button class="ghost" id="out">Lock</button></div></header>' +

      '<div class="grid kpis">' +
      kpi('Active today', t.dau) + kpi('Active this week', t.wau) + kpi('Active this month', t.mau) +
      kpi('Daily habit', pct(t.stickiness), 'of monthly users open it on a given day') + kpi('Devices seen', t.people, 'including people who only looked') +
      '</div>' +
      '<div id="members"></div>' +

      '<div class="card"><h2>Active users per day</h2><div class="muted">People using their own money (not the demo). Grey = started that day.</div>' +
      '<div class="chart" id="chart">' + cols + '</div><div class="axis"><span>' + short(d.from) + '</span><span>' + short(d.today) + '</span></div>' +
      '<div class="legend"><span><i style="background:var(--accent)"></i>Returning</span><span><i style="background:var(--bar2)"></i>New that day</span></div></div>' +

      '<div class="grid two">' +
      '<div class="card"><h2>Coming back</h2><div class="muted">Of people who started in this period</div><div class="ret">' +
      retCell('Next day', r.d1) + retCell('After a week', r.w1) + retCell('After a month', r.m1) + '</div>' +
      '<p class="note">“After a week” = used it again 7–13 days after starting. “After a month” = 28–35 days.</p></div>' +

      '<div class="card"><h2>Daily habit</h2><div class="muted">Last 30 days</div><div class="ret">' +
      '<div><div class="muted">Logs per active day</div><div class="n">' + d.habit.logsPerActiveDay + '</div></div>' +
      '<div><div class="muted">Days with a log</div><div class="n">' + pct(d.habit.daysWithLogPct) + '</div></div>' +
      '<div><div class="muted">Streak avg · best</div><div class="n">' + d.habit.streakAvg + ' · ' + d.habit.streakBest + '</div></div></div>' +
      '<h2 style="margin-top:16px">Days active in the last 30</h2><div class="rows">' + bars(d.habit.daysActive, Math.max.apply(null, d.habit.daysActive.map(function (x) { return x.n; }).concat(1))) + '</div></div>' +

      '<div class="card"><h2>Setup steps</h2><div class="muted">Everyone seen in the last 30 days, where they are now</div><div class="rows">' + bars(funnel, top) + '</div></div>' +

      '<div class="card"><h2>Categories used this month</h2><div class="muted">Average ' + d.categories.avg + ' per person</div><div class="rows">' +
      bars(d.categories.spread, Math.max.apply(null, d.categories.spread.map(function (x) { return x.n; }).concat(1))) + '</div></div>' +

      '<div class="card"><h2>Features</h2><div class="muted">Devices that used each at least once, last 30 days</div><div class="rows">' + bars(f, fMax) + '</div></div>' +

      '<div class="card"><h2>Devices</h2><div class="muted">Last 30 days</div><div class="rows">' + dev(d.devices.platform) + '</div>' +
      '<div class="rows" style="margin-top:16px">' + dev(d.devices.mode) + '</div>' +
      '<h2 style="margin-top:16px">App version</h2><div class="rows">' + dev(d.devices.version.map(function (v) { return { label: v.label.replace('T', ' ') + (v.label.length > 10 ? ' UTC' : ''), n: v.n }; })) + '</div></div>' +
      '</div>' +
      feedback(fb) +
      reminders(push) +
      '<div id="daily"></div>' +
      '<p class="note">One person on two devices counts twice. Nothing here can identify anyone or show amounts.</p>';

    document.getElementById('days').onchange = function (e) { days = Number(e.target.value); load(); };
    document.getElementById('ref').onclick = load;
    document.getElementById('out').onclick = function () { setKey(''); login(); };
    var chart = document.getElementById('chart');
    chart.onmousemove = chart.ontouchstart = function (e) {
      var c = e.target.closest && e.target.closest('.c');
      if (!c) { tip.style.display = 'none'; return; }
      var p = e.touches ? e.touches[0] : e;
      tip.textContent = c.getAttribute('data-tip'); tip.style.display = 'block';
      tip.style.left = Math.min(window.innerWidth - 90, Math.max(90, p.clientX)) + 'px'; tip.style.top = p.clientY + 'px';
    };
    chart.onmouseleave = function () { tip.style.display = 'none'; };
  }

  function kpi(label, n, sub) {
    return '<div class="card kpi"><div class="l">' + esc(label) + '</div><div class="n">' + (typeof n === 'number' ? fmt(n) : esc(n)) + '</div>' + (sub ? '<div class="muted">' + esc(sub) + '</div>' : '') + '</div>';
  }

  load();
})();
</script>
</body>
</html>
