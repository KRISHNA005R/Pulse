# Netlify builds the app from this repository on every push to the main branch.
[build]
  # The unit tests run first: if any test fails, the build stops and nothing goes live.
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Reminders: send whatever has fallen due, every 15 minutes.
[functions."push-cron"]
  schedule = "*/15 * * * *"
